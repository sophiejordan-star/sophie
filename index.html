<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sophie Jordan VR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script> 
    <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
</head>
<!-- This is the main body of the website- ALL your content goes AFTER the <body> tag and before the </body> tag -->
<body>
<!--enviroment-->
<a-scene>
    <a-assets>
    <!--Assets-->
    <img id="art1" src="images/daliah.png" title="Image by K L from Pixabay" preload="auto">
    <img id="art2" src="images/cat.jpg" title="Image by K L from Pixabay" preload="auto">
    <img id="art2" src="fish.png" title="Image by Ray_Shrewsberry from Pixabay" preload="auto">
    <img id="art2" src="" title="Image by Ray_Shrewsberry from Pixabay" preload="auto">
  

    </a-assets>
<a-entity environment="preset:forest;dressingAmount:500;skyColor:black"></a-entity>
<!--Museum start-->
<a-cylinder id="floor" position="0 0 0" radius="7.5" color="FFEAD0" height="0.1"></a-cylinder>
<a-box id="wall1" position="0 1.473 4.907" rotation="0 0 0" scale="10 3 0.2" color="#56351E"></a-box>
<a-box id="wall2" position="0 1.473 -4.907" rotation="0 0 0" scale="10 3 0.2" color="#56351E"></a-box>
<a-box id="wall3" position="5.049 1.454 -0.008" rotation="0 -90 0" scale="10 3 0.2" color="#56351E"></a-box>
<a-box id="wall4" position="-5.049 1.454 -0.008" rotation="0 -90 0" scale="10 3 0.2" color="#56351E"></a-box>
<!--Roof-->
<a-cylinder id="triangle_front" segments-radial="3" position="0 3.874 4.907" rotation="-90 0 0" scale="5.774 0.2 1.8" color="#56351E"></a-cylinder>
<a-cylinder id="triangle_back" segments-radial="3" position="0 3.874 -4.907" rotation="-90 0 0" scale="5.774 0.2 1.8" color="#56351E"></a-cylinder>
<a-box id="roof_right" position="2.580 4.328 0" rotation="28.433 90 0" scale="10.931 0.20 6.110" color="black"></a-box>
<a-box id="roof_left" position="-2.599 4.321 -0.017" rotation="28.433 -90 0" scale="10.931 0.20 6.130" color="black"></a-box>




















</a-scene>
</body>
</html>
